# HelloWorld Skill Configuration
skill.name=HelloWorldSkill
skill.version=1.0.0
skill.description=Simple greeting and introduction skill for learning

# Intent mapping
intent.greeting.patterns=hello.intent
intent.greeting.action=greeting
intent.greeting.confidence=0.8

# Response templates
response.greeting.default=Hello! I'm the Sapphire Assistant. How can I help you today?
response.greeting.withName=Hello {name}! I'm the Sapphire Assistant. How can I help you today?
response.introduction=I'm the Sapphire Assistant Framework, an open-source voice assistant that works completely offline!

# Feature flags
feature.personalizedGreeting=true
feature.timeBasedGreeting=false