if(project.single){
    apply plugin: 'com.android.library'
    apply plugin: 'kotlin-android'
    apply plugin: 'kotlin-kapt'
    apply plugin: 'dagger.hilt.android.plugin'
}else{
    apply plugin: 'com.android.application'
    apply plugin: 'kotlin-android'
    apply plugin: 'kotlin-kapt'
    apply plugin: 'dagger.hilt.android.plugin'
}

android {
    namespace "com.example.sapphireassistantframework.processormodule"
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        if(project.single != true) {
            applicationId "com.example.parsermodule"
        }
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        viewBinding true
        dataBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = rootProject.ext.composeCompilerVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        ]
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation rootProject.ext.deps.androidxCore
    implementation rootProject.ext.deps.appCompat
    implementation rootProject.ext.deps.material
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // Architecture Components
    implementation rootProject.ext.deps.viewModel
    implementation rootProject.ext.deps.liveData
    implementation rootProject.ext.deps.lifecycleCommon
    
    // Dependency Injection
    implementation rootProject.ext.deps.hilt
    kapt rootProject.ext.deps.hiltKapt
    
    // Coroutines
    implementation rootProject.ext.deps.coroutinesCore
    implementation rootProject.ext.deps.coroutinesAndroid
    
    // WorkManager
    implementation rootProject.ext.deps.workManager
    implementation rootProject.ext.deps.workManagerHilt
    
    // Compose BOM
    implementation platform(rootProject.ext.deps.composeBom)
    implementation rootProject.ext.deps.composeUi
    implementation rootProject.ext.deps.composePreview
    implementation rootProject.ext.deps.composeMaterial3
    debugImplementation rootProject.ext.deps.composeTooling
    
    // Legacy Stanford CoreNLP
    implementation files('libs/stanford-corenlp-4.1.0.jar')
    //implementation files('libs/stanford-ner-4.2.0.jar')
    
    // Module dependencies
    implementation project(":packages:framework:ComponentFramework")
    
    // Testing
    testImplementation rootProject.ext.deps.junit
    testImplementation rootProject.ext.deps.mockk
    testImplementation rootProject.ext.deps.coroutinesTest
    androidTestImplementation rootProject.ext.deps.junitExt
    androidTestImplementation rootProject.ext.deps.espresso
    androidTestImplementation 'androidx.annotation:annotation:1.2.0'
    androidTestImplementation rootProject.ext.deps.composeTest
    debugImplementation rootProject.ext.deps.composeTestManifest
}