plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
}

configurations.maybeCreate("default")

android {
    namespace "com.example.sapphireassistantframework"
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "com.example.sapphireassistantframework"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        viewBinding true
        dataBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = rootProject.ext.composeCompilerVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        ]
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

//ant.importBuild 'assets.xml'
//preBuild.dependsOn(list, checksum)
//clean.dependsOn(clean_assets)

dependencies {
    // Core Android
    implementation rootProject.ext.deps.androidxCore
    implementation rootProject.ext.deps.appCompat
    implementation rootProject.ext.deps.material
    implementation rootProject.ext.deps.constraintLayout
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // Architecture Components
    implementation rootProject.ext.deps.viewModel
    implementation rootProject.ext.deps.liveData
    implementation rootProject.ext.deps.lifecycleCommon
    implementation rootProject.ext.deps.navigation
    implementation rootProject.ext.deps.navigationUi
    
    // Room Database
    implementation rootProject.ext.deps.room
    implementation rootProject.ext.deps.roomKtx
    kapt rootProject.ext.deps.roomKapt
    
    // Dependency Injection
    implementation rootProject.ext.deps.hilt
    kapt rootProject.ext.deps.hiltKapt
    
    // Coroutines
    implementation rootProject.ext.deps.coroutinesCore
    implementation rootProject.ext.deps.coroutinesAndroid
    
    // WorkManager
    implementation rootProject.ext.deps.workManager
    implementation rootProject.ext.deps.workManagerHilt
    
    // Security
    implementation rootProject.ext.deps.encryptedPrefs
    
    // Compose BOM
    implementation platform(rootProject.ext.deps.composeBom)
    implementation rootProject.ext.deps.composeUi
    implementation rootProject.ext.deps.composePreview
    implementation rootProject.ext.deps.composeMaterial3
    implementation rootProject.ext.deps.composeActivity
    implementation rootProject.ext.deps.composeViewModel
    debugImplementation rootProject.ext.deps.composeTooling
    
    // Module dependencies
    implementation project(":packages:framework:ComponentFramework")

    // This is for building a standalone assistant APK, rather than each module as a plugin
    if(project.single){
        implementation project(":packages:processing:VoskSTTModule")
        implementation project(":packages:processing:ProcessorModule")
        implementation project(":packages:processing:MultiprocessModule")
        implementation project(":packages:skills:CalendarSkill")
        implementation project(":packages:integrations:TermuxModule")
    }
    
    // Testing
    testImplementation rootProject.ext.deps.junit
    testImplementation rootProject.ext.deps.mockk
    testImplementation rootProject.ext.deps.coroutinesTest
    androidTestImplementation rootProject.ext.deps.junitExt
    androidTestImplementation rootProject.ext.deps.espresso
    androidTestImplementation rootProject.ext.deps.composeTest
    debugImplementation rootProject.ext.deps.composeTestManifest
}